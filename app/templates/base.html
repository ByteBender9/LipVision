<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LipVision{% endblock %}</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', path='css/style.css') }}">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="container">

            <a href="/" class="logo">

                👄 <span>LipVision</span>

            </a>

            <nav>

                <ul>

                    <li><a href="/">Home</a></li>

                    <li><a href="#">About</a></li>

                    <li>
                        <a href="https://github.com/ByteBender9/LipVision"
                           target="_blank">
                            GitHub
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>

    <!-- ================= MAIN ================= -->

    <main>

        {% block content %}

        {% endblock %}

    </main>

    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="container">

            <p>

                Built with ❤️ using Python, FastAPI & OpenCV

            </p>

        </div>

    </footer>

    <!-- JavaScript -->

    <script src="{{ url_for('static', path='js/app.js') }}"></script>

</body>

</html>
